<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/v43.css">
<title>Gym Tracker — V4.3 Visual</title>
</head>
<body>
<div class="app-shell">
<header class="topbar"><div class="brand"><span class="brand-mark">G</span><div><small>TRAINING SYSTEM</small><h1>Gym Tracker</h1></div></div><button id="install" class="icon-btn hidden" aria-label="Install app">↓</button></header>
<main>
<section id="workout" class="view active"></section>
<section id="program" class="view"></section>
<section id="progress" class="view"></section>
<section id="history" class="view"></section>
<section id="settings" class="view"></section>
</main>
<nav class="bottom-nav" aria-label="Main navigation"><button data-v="workout" class="active"><span>⌂</span><small>Today</small></button><button data-v="program"><span>▤</span><small>Program</small></button><button data-v="progress"><span>↗</span><small>Progress</small></button><button data-v="history"><span>◷</span><small>History</small></button><button data-v="settings"><span>•••</span><small>More</small></button></nav>
</div>
<div id="modal" class="hidden"><div id="modalbox"><button id="close" class="modal-close">×</button><div id="modalbody"></div></div></div>
<div id="toast" role="status"></div>
<script src="js/app.js"></script>
<script src="js/v43.js"></script>
</body></html>
